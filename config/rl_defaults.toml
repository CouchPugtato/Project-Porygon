# Shared, stable defaults consumed by the C trainer and Python orchestration tools.
# Experiment configs may override these values explicitly.

policy_gradient_gamma = 1.0
policy_gradient_entropy_coef = 0.001

ppo_gamma = 0.99
live_ppo_learning_rate = 0.001
ppo_entropy_coef = 0.001
# Stable anchored settings selected for iterative league updates.
league_ppo_learning_rate = 0.00001
league_ppo_entropy_coef = 0.0001
league_matchup_target_win_rate = 0.50
league_matchup_min_weight = 0.10
league_matchup_confidence_games = 20
league_min_category_starts = 1
advantage_norm = true
gae_lambda = 0.95
ppo_clip_epsilon = 0.20
ppo_value_clip_epsilon = 0.20
ppo_target_kl = 0.02
# Require a representative amount of data before the running-mean KL stop fires.
ppo_target_kl_min_episodes = 20
ppo_target_kl_min_labels = 500
# A single episode may still stop immediately when it exceeds this multiple.
ppo_target_kl_hard_multiplier = 4.0
# Require repeated extreme minibatches so one reconstruction/outlier batch is
# recorded without immediately discarding an otherwise stable candidate.
ppo_target_kl_hard_consecutive_updates = 2
ppo_shuffle_seed = 1337
# Accumulate this many episodes before each PPO Adam update.
ppo_minibatch_episodes = 8
adam_beta1 = 0.90
adam_beta2 = 0.999
adam_epsilon = 0.00000001

anchor_kl_coef = 0.01
anchor_kl_warn_threshold = 0.10
# Current pre-PPO actor baseline, measured as tera move actions / move actions.
# Do not substitute the roughly 0.86 battle-level Tera usage rate here.
baseline_tera_action_rate = 0.03
min_training_episodes_warn = 100

warn_move_slot_concentration = 0.55
hard_move_slot_collapse = 0.70
warn_switch_slot_6_concentration = 0.60
warn_tera_baseline_ratio = 0.50
fail_fast_earned_win_rate = 0.40
fail_fast_min_games = 150
promotion_earned_win_rate = 0.52
# A candidate must also have its lower 95% confidence bound above this value.
promotion_confidence_threshold = 0.50
promotion_min_tera_baseline_ratio = 0.60
# Slightly above the 0.02 training target so a normal boundary crossing is not
# confused with an unsafe update; the 4x emergency stop is still rejected.
ppo_search_prune_approx_kl = 0.03
ppo_search_prune_tera_action_rate = 0.02
